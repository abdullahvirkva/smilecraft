<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Modern dental treatment suite illustration">
  <!-- wall + floor -->
  <rect x="0" y="0" width="640" height="340" fill="#EAF3F7"/>
  <rect x="0" y="340" width="640" height="140" fill="#D8E6EC"/>
  <rect x="0" y="340" width="640" height="10" fill="#0D7A70" opacity="0.25"/>

  <!-- poster -->
  <g>
    <rect x="60" y="70" width="130" height="150" rx="12" fill="#ffffff" stroke="#0D7A70" stroke-width="6"/>
    <rect x="78" y="92" width="94" height="12" rx="6" fill="#0C2B3E" opacity="0.75"/>
    <rect x="78" y="112" width="70" height="9" rx="4.5" fill="#647E93" opacity="0.5"/>
    <g transform="translate(125 175) scale(0.32)">
      <ellipse cx="0" cy="-52" rx="98" ry="84" fill="#DDF5F0"/>
      <rect x="-72" y="-34" width="54" height="140" rx="27" fill="#DDF5F0" transform="rotate(7 -45 36)"/>
      <rect x="18" y="-34" width="54" height="140" rx="27" fill="#DDF5F0" transform="rotate(-7 45 36)"/>
    </g>
  </g>

  <!-- dental chair -->
  <g>
    <!-- base -->
    <rect x="270" y="360" width="130" height="26" rx="13" fill="#0C2B3E" opacity="0.75"/>
    <rect x="320" y="300" width="30" height="70" rx="10" fill="#0C2B3E" opacity="0.55"/>
    <!-- seat (reclined) -->
    <g transform="rotate(-12 335 300)">
      <rect x="215" y="270" width="250" height="58" rx="29" fill="#3ED6BE"/>
      <rect x="215" y="270" width="250" height="20" rx="10" fill="#ffffff" opacity="0.35"/>
      <!-- headrest -->
      <rect x="440" y="262" width="70" height="52" rx="22" fill="#0D7A70"/>
      <!-- leg rest -->
      <rect x="150" y="282" width="80" height="46" rx="20" fill="#2BB5A0"/>
      <!-- armrest -->
      <rect x="290" y="238" width="90" height="18" rx="9" fill="#0D7A70"/>
    </g>
    <!-- instrument tray -->
    <line x1="520" y1="340" x2="520" y2="250" stroke="#0C2B3E" stroke-width="10" opacity="0.5"/>
    <rect x="470" y="228" width="110" height="26" rx="13" fill="#ffffff" stroke="#0D7A70" stroke-width="5"/>
    <rect x="486" y="200" width="10" height="30" rx="5" fill="#647E93"/>
    <rect x="506" y="204" width="10" height="26" rx="5" fill="#647E93"/>
  </g>

  <!-- overhead lamp -->
  <g>
    <path d="M120 0 v150 q0 40 60 60" fill="none" stroke="#0C2B3E" stroke-width="12" opacity="0.6" stroke-linecap="round"/>
    <g transform="translate(200 225)">
      <rect x="-46" y="-20" width="92" height="44" rx="22" fill="#F5A623"/>
      <ellipse cx="0" cy="26" rx="34" ry="10" fill="#FFE9B8"/>
    </g>
  </g>

  <!-- cabinet -->
  <g>
    <rect x="470" y="300" width="120" height="86" rx="10" fill="#ffffff" stroke="#0D7A70" stroke-width="5"/>
    <line x1="470" y1="343" x2="590" y2="343" stroke="#0D7A70" stroke-width="4" opacity="0.4"/>
    <rect x="520" y="318" width="20" height="8" rx="4" fill="#0D7A70" opacity="0.6"/>
    <rect x="520" y="360" width="20" height="8" rx="4" fill="#0D7A70" opacity="0.6"/>
    <rect x="492" y="272" width="76" height="28" rx="8" fill="#DDF5F0"/>
  </g>

  <!-- plant -->
  <g>
    <path d="M36 340 h48 l-7 40 h-34 Z" fill="#FF7A59"/>
    <ellipse cx="60" cy="310" rx="14" ry="34" fill="#0D7A70" transform="rotate(-18 60 310)"/>
    <ellipse cx="60" cy="310" rx="14" ry="34" fill="#0E8A7E" transform="rotate(14 60 310)"/>
  </g>
</svg>
