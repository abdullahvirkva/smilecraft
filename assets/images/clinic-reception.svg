<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Bright dental clinic reception area illustration">
  <!-- wall + floor -->
  <rect x="0" y="0" width="640" height="340" fill="#EDFAF7"/>
  <rect x="0" y="340" width="640" height="140" fill="#DCEBE7"/>
  <rect x="0" y="340" width="640" height="10" fill="#0D7A70" opacity="0.25"/>

  <!-- window -->
  <g>
    <rect x="400" y="60" width="180" height="200" rx="14" fill="#BFE3EC"/>
    <rect x="400" y="60" width="180" height="200" rx="14" fill="none" stroke="#0C2B3E" stroke-width="10" opacity="0.12"/>
    <line x1="490" y1="60" x2="490" y2="260" stroke="#0C2B3E" stroke-width="8" opacity="0.12"/>
    <line x1="400" y1="160" x2="580" y2="160" stroke="#0C2B3E" stroke-width="8" opacity="0.12"/>
    <circle cx="530" cy="110" r="26" fill="#F5A623" opacity="0.85"/>
    <path d="M410 260 q30 -40 60 -18 q30 -34 60 -16 q25 -20 40 -8 l0 42 l-160 0 Z" fill="#3ED6BE" opacity="0.7"/>
  </g>

  <!-- wall art: tooth frame -->
  <g>
    <rect x="70" y="80" width="120" height="120" rx="16" fill="#ffffff" stroke="#0D7A70" stroke-width="6"/>
    <g transform="translate(130 140) scale(0.5)">
      <ellipse cx="0" cy="-52" rx="98" ry="84" fill="#DDF5F0"/>
      <rect x="-72" y="-34" width="54" height="140" rx="27" fill="#DDF5F0" transform="rotate(7 -45 36)"/>
      <rect x="18" y="-34" width="54" height="140" rx="27" fill="#DDF5F0" transform="rotate(-7 45 36)"/>
      <path d="M-24 -18 q24 26 48 0" fill="none" stroke="#0D7A70" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>

  <!-- pendant lamps -->
  <g stroke="#0C2B3E" stroke-width="6" opacity="0.7">
    <line x1="270" y1="0" x2="270" y2="70"/>
    <line x1="370" y1="0" x2="370" y2="70"/>
  </g>
  <g fill="#F5A623">
    <path d="M246 70 h48 l-10 34 h-28 Z"/>
    <path d="M346 70 h48 l-10 34 h-28 Z"/>
  </g>
  <g fill="#FFE9B8" opacity="0.9">
    <ellipse cx="270" cy="112" rx="16" ry="7"/>
    <ellipse cx="370" cy="112" rx="16" ry="7"/>
  </g>

  <!-- reception desk -->
  <g>
    <rect x="180" y="260" width="280" height="110" rx="14" fill="#ffffff"/>
    <rect x="180" y="260" width="280" height="26" rx="13" fill="#0D7A70"/>
    <rect x="205" y="306" width="120" height="12" rx="6" fill="#0C2B3E" opacity="0.7"/>
    <rect x="205" y="326" width="80" height="10" rx="5" fill="#647E93" opacity="0.45"/>
    <rect x="360" y="300" width="70" height="46" rx="8" fill="#DDF5F0"/>
    <rect x="368" y="308" width="54" height="8" rx="4" fill="#0D7A70" opacity="0.6"/>
    <rect x="368" y="322" width="40" height="7" rx="3.5" fill="#0D7A70" opacity="0.35"/>
  </g>

  <!-- chairs -->
  <g>
    <rect x="90" y="300" width="70" height="18" rx="9" fill="#3ED6BE"/>
    <rect x="100" y="318" width="12" height="52" rx="6" fill="#0C2B3E" opacity="0.55"/>
    <rect x="138" y="318" width="12" height="52" rx="6" fill="#0C2B3E" opacity="0.55"/>
    <rect x="490" y="300" width="70" height="18" rx="9" fill="#3ED6BE"/>
    <rect x="500" y="318" width="12" height="52" rx="6" fill="#0C2B3E" opacity="0.55"/>
    <rect x="538" y="318" width="12" height="52" rx="6" fill="#0C2B3E" opacity="0.55"/>
  </g>

  <!-- plant -->
  <g>
    <path d="M560 340 h52 l-8 44 h-36 Z" fill="#FF7A59"/>
    <path d="M586 340 c-4 -40 -30 -52 -52 -58 c22 -8 44 2 52 22 c8 -20 30 -30 52 -22 c-22 6 -48 18 -52 58" fill="#0D7A70"/>
  </g>

  <!-- rug -->
  <ellipse cx="320" cy="430" rx="200" ry="26" fill="#0D7A70" opacity="0.12"/>
</svg>
